<main class="app-shell">
  <div class="app-shell__inner">
    <header class="app-shell__header">
      <h1>{{ site.appName }}</h1>
      <p class="app-shell__description">{{ site.heading }}</p>
      <p class="app-shell__supporting-copy">{{ site.description }}</p>
    </header>

    <section class="app-shell__scope" aria-labelledby="phase-scope-title">
      <h2 id="phase-scope-title">Alcance actual</h2>
      <ul class="app-shell__scope-list">
        @for (item of site.scopeItems; track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </section>

    <app-midi-upload />
  </div>
</main>
