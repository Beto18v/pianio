<main class="app-shell">
  @if (flowStep() === 'main') {
    <section class="immersive-shell" [attr.aria-label]="site.stage.mainAriaLabel">
      <div class="immersive-shell__stage">
        <div class="immersive-shell__intro">
          <header class="immersive-shell__brand">
            <img
              class="immersive-shell__brand-logo"
              ngSrc="/Logo.png"
              [alt]="site.brand.logoAlt"
              width="96"
              height="96"
            />
            <div class="immersive-shell__brand-copy">
              <p class="immersive-shell__eyebrow">{{ site.brand.stageTagline }}</p>
            </div>
          </header>

          <div class="immersive-shell__topbar">
            <app-midi-upload
              [compact]="true"
              (songParsed)="onSongParsed($event)"
              (playRequested)="onSongPlayRequested()"
            />
            <app-midi-input-monitor [compact]="true" />
          </div>
        </div>

        <div class="immersive-shell__visuals">
          <app-note-rain
            class="immersive-shell__note-rain"
            [song]="currentSong()"
            [currentTime]="playbackState().currentTime"
            [keyboardLayout]="keyboardLayout()"
          />

          @if (!currentSong()) {
            <section class="immersive-shell__empty-state" aria-live="polite">
              <h2>{{ site.stage.idleTitle }}</h2>
              <p>{{ site.stage.idleDescription }}</p>
            </section>
          }
        </div>

        <aside class="immersive-shell__hud">
          <app-playback-controls />
        </aside>

        <div class="immersive-shell__keyboard">
          <app-piano-keyboard
            [layout]="keyboardLayout()"
            [activePitches]="activeInputPitches()"
            [guidePitches]="guideSongPitches()"
          />
        </div>
      </div>
    </section>
  } @else {
    <app-onboarding-flow
      [step]="flowStep()"
      [keyboardLayout]="keyboardLayout()"
      [activeInputPitches]="activeInputPitches()"
      [connectionState]="connectionState()"
      [keyboardCalibrationState]="keyboardCalibrationState()"
      [calibrationErrorMessage]="calibrationErrorMessage()"
      [firstCalibrationLabel]="firstCalibrationLabel()"
      [lastCalibrationLabel]="lastCalibrationLabel()"
      [calibrationSourceLabel]="calibrationSourceLabel()"
      [calibrationConnectionLabel]="calibrationConnectionLabel()"
      [calibrationMappingStatusLabel]="calibrationMappingStatusLabel()"
      [calibrationMappingHint]="calibrationMappingHint()"
      [isMappingInProgress]="isMappingInProgress()"
      [canEnterMainScene]="canEnterMainScene()"
      (goToCalibration)="goToCalibration()"
      (goToWelcome)="goToWelcome()"
      (startCalibration)="startCalibration()"
      (retryCalibration)="retryCalibration()"
      (useFallbackRange)="useFallbackRange()"
      (confirmCalibration)="confirmCalibration()"
    />
  }
</main>
