<main class="app-shell">
  <div class="app-shell__inner">
    <header class="app-shell__header">
      <h1>{{ site.appName }}</h1>
      <p class="app-shell__description">{{ site.heading }}</p>
      <p class="app-shell__supporting-copy">{{ site.description }}</p>
    </header>

    <section class="app-shell__top-controls" aria-label="Controles de entrada MIDI">
      <app-midi-upload (songParsed)="onSongParsed($event)" />
      <app-midi-input-monitor />
    </section>

    <app-playback-controls />
    <app-piano-keyboard [activePitches]="activeInputPitches()" />
    <app-note-roll [song]="currentSong()" [currentTime]="playbackState().currentTime" />
  </div>
</main>
