<section
  class="midi-input-badge"
  [class.midi-input-badge--compact]="compact()"
  [attr.aria-label]="site.midiInput.badgeAriaLabel"
>
  @if (!compact()) {
    <p class="midi-input-badge__label">{{ site.midiInput.fields.devices }}</p>
  }

  @if (primaryDeviceName(); as deviceName) {
    @if (!compact()) {
      <p class="midi-input-badge__status">{{ statusLabel() }}</p>
    }
    <p class="midi-input-badge__device">{{ deviceName }}</p>
  } @else {
    <p class="midi-input-badge__status">{{ statusLabel() }}</p>
  }

  @if (!compact() && errorMessage(); as message) {
    <p class="midi-input-badge__hint">{{ message }}</p>
  }
</section>
