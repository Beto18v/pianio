<div class="stage-keyboard" role="img" [attr.aria-label]="keyboardAriaLabel()">
  <div class="stage-keyboard__range" aria-hidden="true">{{ rangeLabel() }}</div>

  <div class="stage-keyboard__white-keys" aria-hidden="true">
    @for (key of whiteKeys(); track key.pitch) {
      <div
        class="stage-keyboard__key stage-keyboard__key--white"
        [class.stage-keyboard__key--active-white]="activePitches().has(key.pitch)"
        [attr.data-pitch]="key.pitch"
        [style.left]="getKeyStyle(key).left"
        [style.width]="getKeyStyle(key).width"
      >
        @if (labeledWhiteKeyPitches().has(key.pitch)) {
          <span class="stage-keyboard__key-label">{{ key.label }}</span>
        }
      </div>
    }
  </div>

  <div class="stage-keyboard__black-keys" aria-hidden="true">
    @for (key of blackKeys(); track key.pitch) {
      <div
        class="stage-keyboard__key stage-keyboard__key--black"
        [class.stage-keyboard__key--active-black]="activePitches().has(key.pitch)"
        [attr.data-pitch]="key.pitch"
        [style.left]="getKeyStyle(key).left"
        [style.width]="getKeyStyle(key).width"
      ></div>
    }
  </div>
</div>
