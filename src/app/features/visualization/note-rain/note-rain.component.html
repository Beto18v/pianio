@if (layout(); as noteRainLayout) {
  <div
    class="note-rain"
    role="img"
    [class.note-rain--adaptive]="performanceMode() === 'adaptive'"
    [class.note-rain--constrained]="performanceMode() === 'constrained'"
    [attr.aria-label]="accessibleLabel()"
  >
    <div
      class="note-rain__hit-line"
      aria-hidden="true"
      [style.top.px]="noteRainLayout.hitLineTopPx"
    ></div>

    <div class="note-rain__notes" aria-hidden="true">
      @for (
        note of noteRainLayout.notes;
        track note.track + '-' + note.startTime + '-' + note.pitch
      ) {
        <div
          class="note-rain__note"
          [class.note-rain__note--black]="note.isBlack"
          [class.note-rain__note--active]="note.isActive"
          [class.note-rain__note--hand-left]="note.hand === 'left'"
          [class.note-rain__note--hand-right]="note.hand === 'right'"
          [style.left.%]="note.leftPercent"
          [style.width.%]="note.widthPercent"
          [style.transform]="note.transform"
          [style.height.px]="note.heightPx"
          [attr.data-pitch]="note.pitch"
          [attr.data-hand]="note.hand"
        >
          @if (shouldRenderNoteLabels()) {
            <span class="note-rain__label">{{ note.label }}</span>
          }
        </div>
      }
    </div>
  </div>
}
